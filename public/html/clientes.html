<!doctype html>
<html lang="es">

<head>
    <!-- Metaetiquetas requeridas -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <!-- Tu archivo CSS personalizado -->
    <link rel="stylesheet" href="../CSS/style.css">

    <title>Clientes</title>
</head>

<body>
    
    <div class="container-fluid py-4">
        <div class="row">
            <aside class="col-12 col-md-3 mb-4">
                <div class="sidebar p-3 rounded">
                    <div class="text-center">
                        <img src="/img/logo.png" alt="Logo MEGATEL" class="logo-img mb-2">
                        <h1 class="h5 mb-0">Megatel CRM</h1>
                    </div>
                    <hr>
                    <nav class="nav flex-column mt-3">
                        <a class="nav-link" href="/html/proveedores.html">Proveedores</a>
                        <a class="nav-link active" href="/html/clientes.html">Clientes</a>
                        <a class="nav-link" href="/html/registro.html">Registro</a>
                        <a class="nav-link" href="/html/login.html">Login</a>
                    </nav>
                </div>
            </aside>

            <main class="col-12 col-md-9">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h2 class="card-title text-center mb-4">Nuevo Cliente</h2>

                        <div id="form-alert" class="mb-3"></div>

                        <form id="clienteForm" action="/clientes" method="post" novalidate>
                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="nombre">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre Cliente" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="empresa">Empresa</label>
                                    <input type="text" class="form-control" id="empresa" name="empresa" placeholder="Empresa Cliente" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="email">Correo</label>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="email@ejemplo.com" required>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="telefono">Teléfono</label>
                                    <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="+57 300 0000000" required>
                                </div>
                            </div>

                            <div class="form-row">
                                <div class="form-group col-12">
                                    <button type="submit" class="btn btn-primary btn-block">Guardar</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <!-- JS de dependencias de Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"
        integrity="sha384-q8i/X+965DzO0rT7abK41JStQIAqVgRVzpbzo5smXKp4YfRvH+8abtTE1Pi6jizo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.3/dist/umd/popper.min.js"
        integrity="sha384-ZMP7rVo3mIykV+2+9J3UJ46jBk0WLaUAdn689aCwoqbBJiSnjAK/l8WvCWPIPm49" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"
        integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>

    <script>
        // Enviar formulario con fetch y mostrar alertas Bootstrap
        (function(){
            const form = document.getElementById('clienteForm');
            const alertContainer = document.getElementById('form-alert');

            form.addEventListener('submit', function(e){
                e.preventDefault();

                const data = {
                    nombre: form.nombre.value.trim(),
                    email: form.email.value.trim(),
                    telefono: form.telefono.value.trim(),
                    empresa: form.empresa.value.trim()
                };

                // Validación simple
                if(!data.nombre || !data.email || !data.telefono || !data.empresa){
                    showAlert('Todos los campos son obligatorios', 'danger');
                    return;
                }

                fetch('/clientes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).then(r => {
                    if(r.ok) return r.text();
                    throw new Error('Error al guardar');
                }).then(() => {
                    showAlert('Cliente guardado correctamente', 'success');
                    form.reset();
                }).catch(err => {
                    showAlert(err.message || 'Error', 'danger');
                })
            });

            function showAlert(message, type){
                alertContainer.innerHTML = `<div class="alert alert-${type}" role="alert">${message}</div>`;
                setTimeout(()=> alertContainer.innerHTML = '', 3000);
            }
        })();
    </script>
</body>

</html>
